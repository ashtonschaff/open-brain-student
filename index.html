<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Open Brain</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<style>
  :root {
    --bg: #0f0f0f;
    --card: #161616;
    --card-hover: #1c1c1c;
    --border: #262626;
    --accent: #6366f1;
    --accent-dim: #4f46e5;
    --text: #e8e8e8;
    --text-dim: #9a9a9a;
    --danger: #ef4444;
    --success: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
  }
  input, textarea {
    font-family: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    width: 100%;
  }
  input:focus, textarea:focus { outline: 1px solid var(--accent); }

  /* ---------- Auth screen ---------- */
  #authScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .auth-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 380px;
  }
  .auth-box h1 { margin: 0 0 4px; font-size: 22px; }
  .auth-box p.sub { color: var(--text-dim); margin: 0 0 24px; font-size: 14px; }
  .auth-box input { margin-bottom: 12px; }
  .auth-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
  }
  .auth-primary:disabled { opacity: 0.6; }
  .auth-toggle {
    background: none;
    color: var(--accent);
    width: 100%;
    padding: 10px;
    font-size: 13px;
    margin-top: 8px;
  }
  .auth-error {
    color: var(--danger);
    font-size: 13px;
    margin: 8px 0 0;
    min-height: 16px;
  }

  /* ---------- App shell ---------- */
  #app { display: none; max-width: 720px; margin: 0 auto; padding-bottom: 40px; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); flex-shrink: 0; }
  .dot.on { background: var(--success); }
  .status-text { font-size: 12px; color: var(--text-dim); }
  #signOutBtn {
    background: var(--card);
    color: var(--text-dim);
    padding: 8px 14px;
    font-size: 13px;
    border: 1px solid var(--border);
  }

  nav#tabs {
    display: flex;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
    gap: 4px;
    -webkit-overflow-scrolling: touch;
  }
  nav#tabs button {
    background: none;
    color: var(--text-dim);
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    border-radius: 0;
  }
  nav#tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  main { padding: 20px 16px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .meta { color: var(--text-dim); font-size: 12px; margin-bottom: 8px; }
  .card .content { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }

  .btn {
    background: var(--accent);
    color: #fff;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn:disabled { opacity: 0.5; }
  .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn.full { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .field-label { font-size: 12px; color: var(--text-dim); margin: 14px 0 6px; display: block; }
  textarea { min-height: 140px; resize: vertical; }

  /* mic button */
  .mic-wrap { display: flex; flex-direction: column; align-items: center; padding: 30px 0 10px; }
  #micBtn {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #micBtn.listening { animation: pulse 1.2s infinite; background: var(--danger); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.55); }
    70% { box-shadow: 0 0 0 22px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  .mic-label { margin-top: 12px; font-size: 13px; color: var(--text-dim); }

  /* drop zone */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 36px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  .dropzone.drag { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,0.06); }

  .thumb { width: 100%; max-width: 320px; border-radius: 10px; margin: 10px 0; display: block; }
  .note { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-top: 8px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.ok { color: var(--success); }
  .msg.err { color: var(--danger); }
  .empty { color: var(--text-dim); font-size: 14px; text-align: center; padding: 30px 0; }
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen">
  <div class="auth-box">
    <h1>🧠 Open Brain</h1>
    <p class="sub" id="authSub">Sign in to your brain</p>
    <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
    <button class="auth-primary" id="authSubmitBtn">Sign In</button>
    <button class="auth-toggle" id="authToggleBtn">Need an account? Create one</button>
    <p class="auth-error" id="authError"></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="brand">
      <span class="dot" id="statusDot"></span>
      <span>Open Brain</span>
    </div>
    <button id="signOutBtn">Sign out</button>
  </header>

  <nav id="tabs">
    <button data-tab="recent" class="active">Recent</button>
    <button data-tab="voice">Voice</button>
    <button data-tab="youtube">YouTube</button>
    <button data-tab="pdf">PDF</button>
    <button data-tab="url">URL</button>
    <button data-tab="search">Search</button>
  </nav>

  <main>

    <!-- RECENT -->
    <section class="panel active" id="panel-recent">
      <div id="recentList"><div class="empty">Loading…</div></div>
    </section>

    <!-- VOICE -->
    <section class="panel" id="panel-voice">
      <div class="mic-wrap">
        <button id="micBtn">🎤</button>
        <div class="mic-label" id="micLabel">Tap to start speaking</div>
      </div>
      <label class="field-label">Transcript (edit before saving)</label>
      <textarea id="voiceText" placeholder="Your words will appear here…"></textarea>
      <div class="row">
        <button class="btn" id="voiceSaveBtn">Save thought</button>
        <button class="btn secondary" id="voiceClearBtn">Clear</button>
      </div>
      <p class="msg" id="voiceMsg"></p>
    </section>

    <!-- YOUTUBE -->
      </div>
      <div id="ytPreview"></div>
      <label class="field-label" id="ytTranscriptLabel" style="display:none">Paste the transcript here</label>
      <textarea id="ytTranscript" style="display:none" placeholder="Paste the transcript text…"></textarea>
      <div class="row" id="ytSaveRow" style="display:none">
        <button class="btn" id="ytSaveBtn">Save thought</button>
      </div>
      <p class="msg" id="ytMsg"></p>
    <section class="panel" id="panel-youtube">
<label class="field-label">YouTube URL</label>
<input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
<div class="row">
<button class="btn" id="ytCaptureBtn">Capture</button>
</div>
<p class="msg" id="ytMsg"></p>
</section>

    <!-- URL -->
    <!-- PDF -->
<section class="panel" id="panel-pdf">
<div class="dropzone" id="pdfDropzone">
📄 Drag a PDF here, or tap to choose a file
<input type="file" id="pdfInput" accept="application/pdf" style="display:none">
</div>
<p class="msg" id="pdfProgress"></p>
<label class="field-label" id="pdfTextLabel" style="display:none">Extracted text (edit before saving)</label>
<textarea id="pdfText" style="display:none"></textarea>
<div class="row" id="pdfSaveRow" style="display:none">
<button class="btn" id="pdfSaveBtn">Save thought</button>
</div>
<p class="msg" id="pdfMsg"></p>
</section>section class="panel" id="panel-url">
<label class="field-label">Article URL</label>
<input type="text" id="urlInput" placeholder="https://example.com/article">
<div class="row">
<button class="btn" id="urlCaptureBtn">Capture</button>
</div>
<p class="msg" id="urlMsg"></p>
</section>
    </section>

    <!-- SEARCH -->
    <section class="panel" id="panel-search">
      <input type="text" id="searchInput" placeholder="Search your thoughts…">
      <div class="row">
        <button class="btn" id="searchBtn">Search</button>
        <button class="btn secondary" id="searchClearBtn">Clear</button>
      </div>
      <div id="searchResults" style="margin-top:16px"></div>
    </section>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  /* ============ SUPABASE ============ */
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUser = null;

  /* ============ ENTITY DECODER ============
     PDF text extraction and copy-pasted HTML occasionally leave literal
     entity codes behind instead of the character they stand for. This
     hits Spanish text hardest (accented letters, ¡ ¿ show up constantly).
     &amp; is decoded LAST so a double-escaped "&amp;lt;" can't turn into
     a real "<" by accident. */
  function decodeEntities(text) {
    if (!text) return text;
    const map = [
      ["&lt;", "<"], ["&gt;", ">"], ["&quot;", '"'], ["&#39;", "'"],
      ["&nbsp;", " "], ["&rsquo;", "\u2019"], ["&lsquo;", "\u2018"],
      ["&rdquo;", "\u201d"], ["&ldquo;", "\u201c"], ["&mdash;", "\u2014"],
      ["&ndash;", "\u2013"], ["&hellip;", "\u2026"],
      ["&aacute;", "\u00e1"], ["&Aacute;", "\u00c1"],
      ["&eacute;", "\u00e9"], ["&Eacute;", "\u00c9"],
      ["&iacute;", "\u00ed"], ["&Iacute;", "\u00cd"],
      ["&oacute;", "\u00f3"], ["&Oacute;", "\u00d3"],
      ["&uacute;", "\u00fa"], ["&Uacute;", "\u00da"],
      ["&ntilde;", "\u00f1"], ["&Ntilde;", "\u00d1"],
      ["&iexcl;", "\u00a1"], ["&iquest;", "\u00bf"],
      ["&amp;", "&"]
    ];
    let out = text;
    for (const [entity, char] of map) {
      out = out.split(entity).join(char);
    }
    return out;
  }

  /* ============ AUTH ============ */
  const authScreen = document.getElementById("authScreen");
  const appEl = document.getElementById("app");
  const authEmail = document.getElementById("authEmail");
  const authPassword = document.getElementById("authPassword");
  const authSubmitBtn = document.getElementById("authSubmitBtn");
  const authToggleBtn = document.getElementById("authToggleBtn");
  const authError = document.getElementById("authError");
  const authSub = document.getElementById("authSub");
  let authMode = "signin"; // or "signup"

  authToggleBtn.addEventListener("click", () => {
    authMode = authMode === "signin" ? "signup" : "signin";
    if (authMode === "signup") {
      authSub.textContent = "Create your account";
      authSubmitBtn.textContent = "Create Account";
      authToggleBtn.textContent = "Already have an account? Sign in";
    } else {
      authSub.textContent = "Sign in to your brain";
      authSubmitBtn.textContent = "Sign In";
      authToggleBtn.textContent = "Need an account? Create one";
    }
    authError.textContent = "";
  });

  authSubmitBtn.addEventListener("click", async () => {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || !password) {
      authError.textContent = "Enter an email and password.";
      return;
    }
    authSubmitBtn.disabled = true;
    authError.textContent = "";
    try {
      const { error } = authMode === "signup"
        ? await supabase.auth.signUp({ email, password })
        : await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } catch (err) {
      authError.textContent = err.message || "Something went wrong.";
    } finally {
      authSubmitBtn.disabled = false;
    }
  });

  document.getElementById("signOutBtn").addEventListener("click", async () => {
    await supabase.auth.signOut();
  });

  supabase.auth.onAuthStateChange((_event, session) => {
    currentUser = session ? session.user : null;
    if (currentUser) {
      authScreen.style.display = "none";
      appEl.style.display = "block";
      checkConnection();
      loadRecent();
    } else {
      authScreen.style.display = "flex";
      appEl.style.display = "none";
    }
  });

  /* ============ CONNECTION STATUS ============ */
  async function checkConnection() {
    const dot = document.getElementById("statusDot");
    try {
      const { error } = await supabase.from("thoughts").select("id").limit(1);
      dot.classList.toggle("on", !error);
    } catch {
      dot.classList.remove("on");
    }
  }

  /* ============ TABS ============ */
  document.querySelectorAll("#tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      if (btn.dataset.tab === "recent") loadRecent();
    });
  });

  /* ============ SHARED: save + render ============ */
  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  function renderCards(container, thoughts) {
    if (!thoughts || thoughts.length === 0) {
      container.innerHTML = '<div class="empty">Nothing here yet.</div>';
      return;
    }
    container.innerHTML = thoughts.map(t => `
      <div class="card">
        <div class="meta">${formatTime(t.created_at)}</div>
        <div class="content">${escapeHtml(t.content).slice(0, 600)}</div>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  async function loadRecent() {
    const container = document.getElementById("recentList");
    const { data, error } = await supabase
      .from("thoughts")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(20);
    if (error) {
      container.innerHTML = '<div class="empty">Could not load thoughts.</div>';
      return;
    }
    renderCards(container, data);
  }

  async function saveThought({ content, metadata }) {
    const { data, error } = await supabase
      .from("thoughts")
      .insert({ content, user_id: currentUser.id, metadata: metadata || {} })
      .select()
      .single();
    if (error) throw error;
    return data;
  }

  async function saveSource({ thoughtId, sourceText, sourceKind }) {
    try {
      const { error } = await supabase.from("thought_sources").insert({
        thought_id: thoughtId,
        user_id: currentUser.id,
        source_text: sourceText,
        source_kind: sourceKind,
        char_count: sourceText.length,
        truncated: false
      });
      if (error) console.warn("thought_sources insert failed:", error.message);
    } catch (err) {
      console.warn("thought_sources insert failed:", err.message);
    }
  }

  /* ============ VOICE ============ */
  const micBtn = document.getElementById("micBtn");
  const micLabel = document.getElementById("micLabel");
  const voiceText = document.getElementById("voiceText");
  const voiceMsg = document.getElementById("voiceMsg");
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let listening = false;

  if (!SpeechRecognition) {
    micLabel.textContent = "Voice capture isn't supported in this browser. Try Chrome or Edge.";
    micBtn.disabled = true;
  } else {
    recognizer = new SpeechRecognition();
    recognizer.continuous = true;
    recognizer.interimResults = true;
    recognizer.lang = "en-US";

    recognizer.onresult = (event) => {
      let finalText = voiceText.dataset.finalText || "";
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalText += transcript + " ";
        } else {
          interim += transcript;
        }
      }
      voiceText.dataset.finalText = finalText;
      voiceText.value = finalText + interim;
    };

    recognizer.onerror = () => {
      voiceMsg.textContent = "Mic error — check your browser's microphone permission.";
      voiceMsg.className = "msg err";
      stopListening();
    };

    recognizer.onend = () => {
      if (listening) recognizer.start(); // keep going until user stops it
    };
  }

  function stopListening() {
    listening = false;
    micBtn.classList.remove("listening");
    micLabel.textContent = "Tap to start speaking";
    if (recognizer) recognizer.stop();
  }

  micBtn.addEventListener("click", () => {
    if (!recognizer) return;
    if (listening) {
      stopListening();
    } else {
      voiceText.dataset.finalText = voiceText.value ? voiceText.value + " " : "";
      listening = true;
      micBtn.classList.add("listening");
      micLabel.textContent = "Listening… tap to stop";
      recognizer.start();
    }
  });

  document.getElementById("voiceClearBtn").addEventListener("click", () => {
    voiceText.value = "";
    voiceText.dataset.finalText = "";
    voiceMsg.textContent = "";
  });

  document.getElementById("voiceSaveBtn").addEventListener("click", async () => {
    const text = voiceText.value.trim();
    if (!text) { voiceMsg.textContent = "Nothing to save yet."; voiceMsg.className = "msg err"; return; }
    try {
      await saveThought({ content: "🎤 " + text });
      voiceMsg.textContent = "Saved.";
      voiceMsg.className = "msg ok";
      voiceText.value = "";
      voiceText.dataset.finalText = "";
    } catch (err) {
      voiceMsg.textContent = "Could not save: " + err.message;
      voiceMsg.className = "msg err";
    }
  });

  /* ============ YOUTUBE ============ */
const ytUrl = document.getElementById("ytUrl");
const ytMsg = document.getElementById("ytMsg");

document.getElementById("ytCaptureBtn").addEventListener("click", async () => {
const url = ytUrl.value.trim();
if (!url) {
ytMsg.textContent = "Paste a YouTube link first.";
ytMsg.className = "msg err";
return;
}
ytMsg.textContent = "Fetching transcript… this can take a few seconds.";
ytMsg.className = "msg";
try {
const { data, error } = await supabase.functions.invoke("capture-youtube", { body: { url } });
if (error) throw error;
if (!data.ok) throw new Error(data.error || "Capture failed.");
ytMsg.textContent = `Saved: ${data.title}${data.has_transcript ? "" : " (no captions found — saved from the description instead)"}`;
ytMsg.className = "msg ok";
ytUrl.value = "";
} catch (err) {
ytMsg.textContent = "Could not capture: " + (err.message || err);
ytMsg.className = "msg err";
}
});


  /* ============ PDF ============ */
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const pdfDropzone = document.getElementById("pdfDropzone");
  const pdfInput = document.getElementById("pdfInput");
  const pdfProgress = document.getElementById("pdfProgress");
  const pdfTextLabel = document.getElementById("pdfTextLabel");
  const pdfText = document.getElementById("pdfText");
  const pdfSaveRow = document.getElementById("pdfSaveRow");
  const pdfMsg = document.getElementById("pdfMsg");
  let pdfFileName = "";

  pdfDropzone.addEventListener("click", () => pdfInput.click());
  pdfDropzone.addEventListener("dragover", (e) => { e.preventDefault(); pdfDropzone.classList.add("drag"); });
  pdfDropzone.addEventListener("dragleave", () => pdfDropzone.classList.remove("drag"));
  pdfDropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    pdfDropzone.classList.remove("drag");
    if (e.dataTransfer.files.length) handlePdfFile(e.dataTransfer.files[0]);
  });
  pdfInput.addEventListener("change", () => {
    if (pdfInput.files.length) handlePdfFile(pdfInput.files[0]);
  });

  async function handlePdfFile(file) {
    if (file.type !== "application/pdf") {
      pdfProgress.textContent = "That's not a PDF file.";
      pdfProgress.className = "msg err";
      return;
    }
    pdfFileName = file.name;
    pdfProgress.className = "msg";
    try {
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      let fullText = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        pdfProgress.textContent = `Extracting page ${i} of ${pdf.numPages}…`;
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(" ") + "\n\n";
      }
      pdfText.value = decodeEntities(fullText.trim());
      pdfProgress.textContent = `Extracted ${pdf.numPages} page(s) from ${pdfFileName}.`;
      pdfTextLabel.style.display = "block";
      pdfText.style.display = "block";
      pdfSaveRow.style.display = "flex";
    } catch (err) {
      pdfProgress.textContent = "Could not read that PDF: " + err.message;
      pdfProgress.className = "msg err";
    }
  }

  document.getElementById("pdfSaveBtn").addEventListener("click", async () => {
    const text = pdfText.value.trim();
    if (!text) { pdfMsg.textContent = "Nothing to save."; pdfMsg.className = "msg err"; return; }
    try {
      const content = `📄 PDF: ${pdfFileName}\n\n${text}`;
      await saveThought({ content });
      pdfMsg.textContent = "Saved.";
      pdfMsg.className = "msg ok";
      pdfText.value = "";
      pdfTextLabel.style.display = "none";
      pdfText.style.display = "none";
      pdfSaveRow.style.display = "none";
      pdfProgress.textContent = "";
      pdfInput.value = "";
    } catch (err) {
      pdfMsg.textContent = "Could not save: " + err.message;
      pdfMsg.className = "msg err";
    }
  });

  /* ============ URL ============ */
document.getElementById("urlCaptureBtn").addEventListener("click", async () => {
const urlMsg = document.getElementById("urlMsg");
const url = document.getElementById("urlInput").value.trim();
if (!url) {
urlMsg.textContent = "Paste a link first.";
urlMsg.className = "msg err";
return;
}
urlMsg.textContent = "Fetching page…";
urlMsg.className = "msg";
try {
const { data, error } = await supabase.functions.invoke("capture-url", { body: { url } });
if (error) throw error;
if (!data.ok) throw new Error(data.error || "Capture failed.");
urlMsg.textContent = `Saved: ${data.title}`;
urlMsg.className = "msg ok";
document.getElementById("urlInput").value = "";
} catch (err) {
urlMsg.textContent = "Could not capture: " + (err.message || err);
urlMsg.className = "msg err";
}
});

  /* ============ SEARCH ============ */
  document.getElementById("searchBtn").addEventListener("click", async () => {
    const term = document.getElementById("searchInput").value.trim();
    const container = document.getElementById("searchResults");
    if (!term) return;
    container.innerHTML = '<div class="empty">Searching…</div>';
    const { data, error } = await supabase
      .from("thoughts")
      .select("*")
      .ilike("content", `%${term}%`)
      .order("created_at", { ascending: false });
    if (error) {
      container.innerHTML = '<div class="empty">Search failed.</div>';
      return;
    }
    renderCards(container, data);
  });

  document.getElementById("searchClearBtn").addEventListener("click", () => {
    document.getElementById("searchInput").value = "";
    document.getElementById("searchResults").innerHTML = "";
  });

  /* ============ PWA: service worker ============ */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

})();
</script>
</body>
</html>
